name = "tutor-educacional-inclusivo"
main = "worker.js"
compatibility_date = "2025-01-01"

[build]
command = "mkdir -p public && cp index.html style.css app.js logo.jpg public/"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_FALLBACK_MODEL = "gemini-flash-latest"
