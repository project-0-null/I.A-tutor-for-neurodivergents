name = "i-a-tutor-for-neurodivergents"
main = "worker.js"
compatibility_date = "2025-01-01"
keep_vars = true

[build]
command = "mkdir -p public && cp index.html style.css app.js logo.jpg public/"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_FALLBACK_MODEL = "gemini-flash-lite-latest"
